[workspace]
resolver = "2"
members = ["crates/cpanel-core", "crates/cpanel-hook", "src-tauri"]

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "MIT"
authors = ["Dionel"]
repository = "https://github.com/dioneldaf/claude-panel"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[profile.release]
opt-level = "s"
strip = true
panic = "abort"
